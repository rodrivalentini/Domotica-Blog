{% extends "base.html" %}
{% block titulo %}Editar perfil — DomoticAR{% endblock %}
{% block contenido %}
    <h1>Editar perfil</h1>
    <form class="formulario" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="boton" type="submit">Guardar cambios</button>
        <a href="{% url 'perfil' %}">Cancelar</a>
    </form>
{% endblock %}
