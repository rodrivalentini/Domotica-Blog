{% extends "base.html" %}
{% block titulo %}Eliminar post — DomoticAR{% endblock %}
{% block contenido %}
    <h1>¿Eliminar este post?</h1>
    <p>Vas a eliminar <strong>{{ post.titulo }}</strong>. Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button class="boton peligro" type="submit">Sí, eliminar</button>
        <a class="boton" href="{{ post.get_absolute_url }}">Cancelar</a>
    </form>
{% endblock %}
