{% if is_paginated %}
    <nav class="paginacion">
        {% if page_obj.has_previous %}
            <a class="boton" href="?{% if query %}q={{ query|urlencode }}&{% endif %}page={{ page_obj.previous_page_number }}">&larr; Anterior</a>
        {% endif %}
        <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
        {% if page_obj.has_next %}
            <a class="boton" href="?{% if query %}q={{ query|urlencode }}&{% endif %}page={{ page_obj.next_page_number }}">Siguiente &rarr;</a>
        {% endif %}
    </nav>
{% endif %}
