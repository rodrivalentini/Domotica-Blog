{% extends "base.html" %}
{% block titulo %}{% if object %}Editar post{% else %}Nuevo post{% endif %} — DomoticAR{% endblock %}
{% block contenido %}
    <h1>{% if object %}Editar post{% else %}Nuevo post{% endif %}</h1>
    <form class="formulario" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="boton" type="submit">Guardar</button>
        <a href="{% url 'home' %}">Cancelar</a>
    </form>
{% endblock %}
